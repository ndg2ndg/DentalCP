<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Dental Center Pediatrics</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:transparent;font-family:'Segoe UI',sans-serif;overflow:hidden;pointer-events:none;}

  #bubble{
    position:fixed;bottom:18px;right:18px;
    width:58px;height:58px;border-radius:50%;
    background:#4a90d9;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 18px rgba(74,144,217,.45);
    transition:transform .2s;
    pointer-events:auto;
    z-index:10000;
  }
  #bubble:hover{transform:scale(1.07);}
  #bubble svg{width:28px;height:28px;fill:#fff;}

  #tooltip{
    position:fixed;bottom:30px;right:86px;
    background:#1a2e44;color:#fff;font-size:13px;font-weight:500;
    padding:9px 14px;border-radius:8px;white-space:nowrap;
    box-shadow:0 4px 14px rgba(0,0,0,.2);
    opacity:0;pointer-events:none;
    transform:translateX(6px);
    transition:opacity .18s,transform .18s;
    z-index:10000;
  }
  #tooltip::after{
    content:'';position:absolute;top:50%;right:-5px;
    transform:translateY(-50%);
    border-width:5px 0 5px 5px;border-style:solid;
    border-color:transparent transparent transparent #1a2e44;
  }
  #bubble:hover + #tooltip{opacity:1;transform:translateX(0);}

  #overlay{
    position:fixed;bottom:88px;right:18px;
    width:400px;height:600px;max-width:calc(100vw - 24px);max-height:calc(100vh - 110px);
    background:#fff;border-radius:14px;overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
    display:none;
    flex-direction:column;
    pointer-events:auto;
    z-index:10000;
  }
  #overlay.open{display:flex;}
  #overlayHeader{
    background:#1a2e44;color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:flex-end;
    padding:6px 8px;
  }
  #closeBtn{
    background:none;border:none;color:#fff;font-size:20px;
    line-height:1;cursor:pointer;padding:4px 8px;border-radius:6px;
    transition:background .15s;
  }
  #closeBtn:hover{background:rgba(255,255,255,.15);}
  #overlay iframe{flex:1;width:100%;border:none;display:block;}
</style>
</head>
<body>

<button id="bubble" onclick="toggleChat()" aria-label="Open chat">
  <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.02 2 11c0 2.61 1.28 4.94 3.32 6.61-.14 1.31-.6 2.68-1.32 3.89 1.71-.32 3.36-1.03 4.63-1.98C9.65 19.83 10.8 20 12 20c5.52 0 10-4.02 10-9s-4.48-9-10-9z"/></svg>
</button>
<div id="tooltip">Have a question? We're here to help!</div>

<div id="overlay">
  <div id="overlayHeader">
    <button id="closeBtn" onclick="toggleChat()" aria-label="Close chat">&times;</button>
  </div>
  <iframe id="chatFrame" data-src="https://dcp-inbox.consulting4real.com/webchat" title="Chat with Dental Center Pediatrics"></iframe>
</div>

<script>
var overlay   = document.getElementById('overlay');
var chatFrame = document.getElementById('chatFrame');

// Belt-and-suspenders: force the hidden state in JS too, in case of any
// CSS load-order edge case, and don't load the chat iframe at all until
// the panel is actually opened for the first time.
overlay.classList.remove('open');
overlay.style.display = 'none';

function toggleChat() {
  var opening = !overlay.classList.contains('open');
  overlay.classList.toggle('open');
  overlay.style.display = opening ? 'flex' : 'none';
  if (opening && !chatFrame.src) {
    chatFrame.src = chatFrame.getAttribute('data-src');
  }
}
</script>

</body>
</html>
